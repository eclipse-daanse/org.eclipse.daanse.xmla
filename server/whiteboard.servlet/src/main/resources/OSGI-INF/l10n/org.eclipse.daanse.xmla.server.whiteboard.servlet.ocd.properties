# XMLA HTTP Whiteboard Servlet Configuration Localization

# OCD Names and Descriptions
ocd.servlet.name=XMLA Servlet
ocd.servlet.description=XMLA endpoint on the OSGi HTTP Whiteboard. Where it answers is set with osgi.http.whiteboard.servlet.pattern.

# Property Names and Descriptions
requirePrincipal.name=Require Principal
requirePrincipal.description=Whether unauthenticated requests are restricted to the anonymous rowsets
anonymousRowsets.name=Anonymous Rowsets
anonymousRowsets.description=The rowsets an unauthenticated client may still ask when Require Principal is on

containerRoles.name=Container roles
containerRoles.description=The roles to ask the container about for a caller it authenticated. The Servlet API can only answer whether a caller holds a named role, so a role not named here cannot be discovered.
